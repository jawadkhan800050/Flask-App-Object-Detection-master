{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-8">

    <div class="card p-4 shadow-sm">
      <h4 class="text-center mb-3">Detection Result</h4>

      <div class="text-center mb-4">
        <img
          src="{{ url_for('static', filename='detections/' + display_detection) }}"
          class="img-fluid rounded"
          style="max-height:350px;"
        >
      </div>

      <strong>Detected Objects:</strong>
      <div class="mt-2 mb-3">
        {% for obj in detected_objects %}
          <span class="badge bg-success me-1">{{ obj }}</span>
        {% endfor %}
      </div>

      <div class="d-flex gap-2">
        <a href="/" class="btn btn-outline-secondary">Upload Another</a>
        <a href="{{ url_for('static', filename='detections/' + display_detection) }}"
           class="btn btn-outline-primary" download>
          Download Image
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
